html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:transparent;overflow:hidden;font-family:Inter,"Segoe UI",system-ui,sans-serif;color:#eaf2ff}
#stage{position:relative;width:100%;height:100%;cursor:grab;touch-action:none;overflow:hidden;cursor:grab;touch-action:none;overflow:hidden}
#stage:active{cursor:grabbing}
#stage canvas{position:absolute;inset:0;pointer-events:none}
#tint{position:absolute;pointer-events:none;border-radius:50%;mix-blend-mode:screen;opacity:0;transition:opacity .4s;background:radial-gradient(circle,color-mix(in srgb,var(--g,#22d3ee) 55%,transparent) 0,transparent 66%)}

#ui,#lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#lines path{fill:none;stroke-width:1.2;stroke-opacity:.5;transition:stroke-opacity .25s,stroke-width .25s}
#lines circle{filter:drop-shadow(0 0 5px currentColor)}
.a{position:absolute;transform:translate(-50%,-50%);opacity:0;transition:opacity .9s ease var(--d,0s)}.on .a{opacity:1}
.f{animation:fl 7s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-4px)}}
.pill,.card{pointer-events:auto;cursor:pointer;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s,border-color .3s}
.pill{display:flex;align-items:center;gap:9px;height:40px;padding:0 18px 0 13px;border-radius:999px;border:1px solid color-mix(in srgb,var(--c) 75%,transparent);background:linear-gradient(180deg,rgba(18,28,62,.82),rgba(7,12,32,.88));backdrop-filter:blur(10px);font-weight:600;font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 8px 24px rgba(0,0,0,.45),0 0 22px color-mix(in srgb,var(--c) 30%,transparent)}
.pill svg{width:18px;height:18px;fill:none;stroke:var(--c);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pill:hover{transform:translateY(-2px) scale(1.05);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 10px 30px rgba(0,0,0,.5),0 0 34px color-mix(in srgb,var(--c) 60%,transparent)}
.cnt{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:7px;font:500 13px var(--mono);color:#c4d7f5}
.cnt b{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.card{width:208px;padding:13px 14px 14px;border-radius:14px;background:linear-gradient(145deg,rgba(22,38,84,.58),rgba(8,14,38,.62));backdrop-filter:blur(12px);border:1px solid rgba(140,190,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 14px 40px rgba(0,0,0,.5)}
.card h4{margin:0 0 10px;font-size:13px;font-weight:600;letter-spacing:.01em}
.card .r{display:flex;gap:10px;align-items:center;justify-content:space-between}
.card .st{margin-top:10px;font:400 10.5px var(--mono);color:#6ee7ff}
.card .tg{display:inline-block;margin-top:8px;padding:3px 8px;border-radius:6px;border:1px solid rgba(140,190,255,.28);background:rgba(60,110,200,.14);font:400 10.5px var(--mono);color:#bcd2f5}
.L .card{transform:perspective(900px) rotateY(14deg)}.R .card{transform:perspective(900px) rotateY(-14deg)}
.L .card:hover,.R .card:hover{transform:perspective(900px) rotateY(0) translateY(-5px);border-color:rgba(110,231,255,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 18px 48px rgba(0,0,0,.55),0 0 30px rgba(80,200,255,.28)}
.hud{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:24px;display:flex;gap:22px;font:400 11px var(--mono);letter-spacing:.08em;color:#a9c3ee;pointer-events:none}
.hud span:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#34f5a0;box-shadow:0 0 8px #34f5a0;margin-right:8px}
.hz{position:absolute;left:-25%;width:150%;bottom:-32%;height:42%;border-radius:50%;background:radial-gradient(ellipse at 50% 0,#0b3a7a 0,#051233 55%,#030615 80%);border-top:2px solid #6fe8ff;box-shadow:0 -4px 40px #2aa8ff,0 -1px 120px rgba(42,168,255,.5);pointer-events:none}
.sc{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font:400 11px var(--mono);letter-spacing:.12em;color:#6ee7ff;pointer-events:none}
@media (max-width:760px){.card,.hud{display:none}.pill{height:32px;font-size:10.5px;padding:0 11px 0 9px}.cnt{font-size:11px}}
@media (prefers-reduced-motion:reduce){.f{animation:none}}
